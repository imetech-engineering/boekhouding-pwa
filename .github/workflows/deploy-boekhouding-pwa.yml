# Deploy alleen applications/boekhouding/pwa naar GitHub Pages (site-root = PWA-bestanden).
# Draait alleen in de boekhouding-pwa repo (de monorepo pusht naar twee remotes).
# Na push: Repo Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy boekhouding PWA

on:
  push:
    branches: [main, master]
    paths:
      - "applications/boekhouding/pwa/**"
      - ".github/workflows/deploy-boekhouding-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-boekhouding-pwa
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'imetech-engineering/boekhouding-pwa'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: applications/boekhouding/pwa

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
