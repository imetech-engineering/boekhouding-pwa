# Deploy only applications/uren/pwa to GitHub Pages (site root = PWA files).
# After push: Repo Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy uren PWA

on:
  push:
    branches: [main, master]
    paths:
      - "applications/uren/pwa/**"
      - ".github/workflows/deploy-uren-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-uren-pwa
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: applications/uren/pwa

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
